<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Live Match — Background Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#FFD24C;
    --gold-hot:#FFC02E;
    --ink:#FFFFFF;
    --ink-dim:#B9B4C4;
    --void:#0A0710;
    --font-title:'Anton',sans-serif;
    --font-body:'Poppins',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:#1c1c22;
    font-family:var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  .phone-frame{
    width:390px; height:844px;
    border-radius:44px; padding:14px;
    background:#000;
    box-shadow:0 30px 90px rgba(0,0,0,.65), 0 0 0 2px #2a2a33;
    position:relative;
  }
  .phone-notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#000; border-radius:0 0 18px 18px;
    z-index:80;
  }
  .screen{
    width:100%; height:100%; border-radius:32px; overflow:hidden; position:relative;
    background:
      radial-gradient(ellipse 100% 50% at 50% 100%, rgba(184,52,201,.22), transparent 65%),
      radial-gradient(ellipse 90% 45% at 50% 0%, rgba(255,193,60,.14), transparent 60%),
      linear-gradient(180deg, #150A1F 0%, #0D0714 45%, #0A0710 100%);
  }

  /* --- Background layer: stage floor, spotlight beams, drifting
     particles, curtain drapes. Fills the whole frame — this is what
     shows behind your camera the entire time you're live. --- */
  .arena-bg{
    position:absolute; inset:0; z-index:0; overflow:hidden;
    pointer-events:none;
  }
  .star-field{
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 8% 12%, rgba(255,240,200,.9), transparent),
      radial-gradient(1px 1px at 18% 22%, rgba(255,240,200,.7), transparent),
      radial-gradient(2px 2px at 28% 8%, rgba(255,210,76,.85), transparent),
      radial-gradient(1px 1px at 40% 18%, rgba(255,240,200,.6), transparent),
      radial-gradient(1.5px 1.5px at 55% 10%, rgba(255,240,200,.8), transparent),
      radial-gradient(1px 1px at 68% 20%, rgba(255,210,76,.7), transparent),
      radial-gradient(2px 2px at 78% 6%, rgba(255,240,200,.9), transparent),
      radial-gradient(1px 1px at 88% 16%, rgba(255,240,200,.6), transparent),
      radial-gradient(1.5px 1.5px at 95% 26%, rgba(255,210,76,.7), transparent),
      radial-gradient(1px 1px at 12% 32%, rgba(255,240,200,.5), transparent),
      radial-gradient(1px 1px at 62% 30%, rgba(255,240,200,.55), transparent),
      radial-gradient(1.5px 1.5px at 30% 65%, rgba(255,240,200,.5), transparent),
      radial-gradient(1px 1px at 75% 72%, rgba(255,210,76,.55), transparent),
      radial-gradient(1px 1px at 15% 80%, rgba(255,240,200,.45), transparent);
    animation:twinkle 3.5s ease-in-out infinite alternate;
  }
  @keyframes twinkle{
    from{ opacity:.55; }
    to{ opacity:1; }
  }
  .curtain{
    position:absolute; top:0; bottom:0; width:7%;
    background:
      repeating-linear-gradient(90deg,
        rgba(0,0,0,.35) 0px, rgba(80,20,20,.55) 8px,
        rgba(120,30,30,.6) 16px, rgba(80,20,20,.55) 24px,
        rgba(0,0,0,.35) 32px
      );
    box-shadow:0 0 40px 10px rgba(0,0,0,.5) inset;
  }
  .curtain-left{ left:0; border-radius:0 40% 40% 0 / 0 8% 8% 0; }
  .curtain-right{ right:0; border-radius:40% 0 0 40% / 8% 0 0 8%; }
  .curtain::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,210,76,.12), transparent 30%);
  }
  .arena-floor{
    position:absolute; left:0; right:0; bottom:0; height:38%;
    background:
      radial-gradient(ellipse 70% 100% at 50% 100%, rgba(255,193,60,.16), transparent 70%),
      linear-gradient(180deg, transparent 0%, rgba(20,10,28,.5) 100%);
  }
  .arena-floor::before{
    content:'';
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(
      90deg, rgba(255,210,76,.05) 0px, rgba(255,210,76,.05) 1px,
      transparent 1px, transparent 46px
    );
    -webkit-mask-image:linear-gradient(180deg, transparent, black 80%);
    mask-image:linear-gradient(180deg, transparent, black 80%);
  }
  .beam{
    position:absolute; top:-10%; width:120px; height:130%;
    background:linear-gradient(180deg, rgba(255,210,76,.10), transparent 75%);
    filter:blur(6px);
    transform-origin:top center;
    animation:sweepBeam 9s ease-in-out infinite;
  }
  .beam.b1{ left:8%; animation-delay:0s; }
  .beam.b2{ left:58%; animation-delay:3s; background:linear-gradient(180deg, rgba(180,120,255,.09), transparent 75%); }
  .beam.b3{ left:80%; animation-delay:6s; }
  @keyframes sweepBeam{
    0%,100%{ transform:rotate(-14deg); opacity:.55; }
    50%{ transform:rotate(14deg); opacity:.9; }
  }
  .drift-particle{
    position:absolute; bottom:-10px; border-radius:50%;
    background:var(--gold);
    opacity:.5;
    animation:driftUp linear infinite;
  }
  @keyframes driftUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.6; }
    90%{ opacity:.4; }
    100%{ transform:translateY(-780px) translateX(var(--drift-x, 20px)); opacity:0; }
  }

  .status-badge{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(255,210,76,.16); border:1px solid rgba(255,210,76,.5);
    color:var(--gold); font-family:var(--font-mono); font-size:9px;
    letter-spacing:1.2px; padding:4px 10px; border-radius:20px; z-index:90;
  }

  /* ==========================================================================
     MVP celebration — full "video type" choreographed sequence: gold tint
     flash, spinning light rays, shockwave rings, DP zooms in with a gold
     ring, name below, MVP crown badge, continuous sparkles during hold,
     then everything scales/fades out. ~5.5s total.
     ========================================================================== */
  .celebration{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:65; opacity:0; pointer-events:none; transition:opacity .25s ease;
    overflow:hidden;
  }
  .celebration.show{ opacity:1; }
  .cel-tint{
    position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 45%, var(--cel-color, rgba(255,210,76,.4)), transparent 68%);
    animation:tintFlash 5.5s ease-out forwards;
  }
  @keyframes tintFlash{
    0%{ opacity:0; } 5%{ opacity:1; } 80%{ opacity:.5; } 100%{ opacity:0; }
  }
  .cel-raylayer{
    position:absolute; top:50%; left:50%;
    width:460px; height:460px; margin:-230px 0 0 -230px;
    background:repeating-conic-gradient(from 0deg,
      var(--cel-color, #FFD24C) 0deg 3deg, transparent 3deg 16deg);
    opacity:.28;
    animation:raySpin 5.5s linear forwards, rayFade 5.5s ease-out forwards;
  }
  @keyframes raySpin{ from{ transform:rotate(0deg); } to{ transform:rotate(160deg); } }
  @keyframes rayFade{
    0%{ opacity:0; } 10%{ opacity:.32; } 82%{ opacity:.2; } 100%{ opacity:0; }
  }
  .cel-shockwave{
    position:absolute; top:50%; left:50%;
    width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%;
    border:3px solid var(--cel-color, #FFD24C);
    animation:shockOut 1.2s cubic-bezier(.15,.8,.3,1) forwards;
  }
  .cel-shockwave.ring2{ animation-delay:.18s; }
  .cel-shockwave.ring3{ animation-delay:.36s; }
  @keyframes shockOut{
    0%{ transform:scale(.15); opacity:1; border-width:5px; }
    100%{ transform:scale(6); opacity:0; border-width:1px; }
  }
  .cel-stage{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    animation:stageShake .5s ease-out;
  }
  @keyframes stageShake{
    0%{ transform:translate(0,0); }
    15%{ transform:translate(-6px,3px); }
    30%{ transform:translate(6px,-3px); }
    45%{ transform:translate(-4px,2px); }
    60%{ transform:translate(4px,-2px); }
    75%{ transform:translate(-2px,1px); }
    100%{ transform:translate(0,0); }
  }

  /* MVP-specific: DP ring + name + crown badge */
  .mvp-crown{
    font-size:34px; filter:drop-shadow(0 0 16px rgba(255,210,76,.9));
    animation:
      crownEntrance .6s cubic-bezier(.34,1.56,.64,1) both,
      crownFloat 2.2s ease-in-out .6s infinite,
      celExit .5s ease-in 4.9s forwards;
    margin-bottom:-6px;
  }
  @keyframes crownEntrance{
    0%{ transform:scale(0) translateY(20px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  @keyframes crownFloat{
    0%,100%{transform:translateY(0) rotate(-5deg);}
    50%{transform:translateY(-5px) rotate(5deg);}
  }
  .mvp-dp-ring{
    width:130px; height:130px; border-radius:50%;
    padding:5px;
    background:conic-gradient(from 0deg, var(--gold), #FFF3C0, var(--gold-hot), var(--gold));
    box-shadow:0 0 50px -2px rgba(255,210,76,.8);
    animation:
      dpEntrance .65s cubic-bezier(.34,1.56,.64,1) .1s both,
      dpBob 1.8s ease-in-out .75s infinite,
      celExit .5s ease-in 4.9s forwards;
  }
  @keyframes dpEntrance{
    0%{ transform:scale(0) rotate(-30deg); opacity:0; }
    60%{ transform:scale(1.15) rotate(6deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); }
  }
  @keyframes dpBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  .mvp-dp-img{
    width:100%; height:100%; border-radius:50%;
    background-size:cover; background-position:center;
    background-color:#241830;
    border:3px solid var(--void);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-title); font-size:44px; color:var(--gold);
  }
  .mvp-name{
    font-family:var(--font-title); font-size:30px; color:var(--ink);
    text-shadow:0 0 30px rgba(255,210,76,.5);
    margin-top:12px; text-align:center; max-width:340px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    animation:captionPunch .5s cubic-bezier(.34,1.56,.64,1) .35s both,
              celExit .4s ease-in 4.95s forwards;
  }
  .mvp-label{
    font-family:var(--font-mono); font-size:12px; letter-spacing:4px;
    color:var(--gold); margin-top:6px;
    animation:captionPunch .5s cubic-bezier(.34,1.56,.64,1) .5s both,
              celExit .4s ease-in 4.95s forwards;
  }
  @keyframes captionPunch{
    0%{ transform:scale(.4) translateY(10px); opacity:0; }
    100%{ transform:scale(1) translateY(0); opacity:1; }
  }
  @keyframes celExit{
    0%{ opacity:1; transform:scale(1); } 100%{ opacity:0; transform:scale(.85); }
  }

  /* Level Up-specific: big number + text, different accent color */
  .lu-label{
    font-family:var(--font-body); font-weight:800; font-size:20px; letter-spacing:2px;
    color:var(--ink); text-shadow:0 0 20px rgba(120,200,255,.6);
    animation:captionPunch .5s cubic-bezier(.34,1.56,.64,1) .1s both,
              celExit .4s ease-in 3.5s forwards;
  }
  .lu-number{
    font-family:var(--font-title); font-size:96px; line-height:1;
    background:linear-gradient(180deg, #EAF6FF 10%, #7CD1FF 55%, #2E8FD9 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 40px rgba(90,190,255,.7));
    margin-top:2px;
    animation:
      numEntrance .6s cubic-bezier(.34,1.56,.64,1) .15s both,
      numPulse 1.4s ease-in-out .8s infinite,
      celExit .45s ease-in 3.55s forwards;
  }
  @keyframes numEntrance{
    0%{ transform:scale(0) translateY(30px); opacity:0; }
    60%{ transform:scale(1.15) translateY(-4px); opacity:1; }
    100%{ transform:scale(1) translateY(0); }
  }
  @keyframes numPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }

  .cel-sparkle{
    position:absolute; border-radius:50%;
    background:var(--cel-color, #FFD24C);
    opacity:0;
    animation:sparkleUp 1.3s ease-out forwards;
  }
  @keyframes sparkleUp{
    0%{ transform:translateY(0) scale(1); opacity:0; }
    10%{ opacity:1; }
    100%{ transform:translateY(-90px) scale(.2); opacity:0; }
  }

  .demo-controls{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:400px; z-index:999;
  }
  .demo-controls button{
    font-family:var(--font-body); font-size:10px; font-weight:600;
    padding:7px 11px; border-radius:8px; border:1px solid #3a3a45;
    background:#1c1c22; color:#fff; cursor:pointer;
  }
  .demo-controls button:hover{ border-color:var(--gold); color:var(--gold); }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="phone-notch"></div>
  <div class="screen">

    <div class="arena-bg">
      <div class="star-field"></div>
      <div class="arena-floor"></div>
      <div class="beam b1"></div>
      <div class="beam b2"></div>
      <div class="beam b3"></div>
      <div class="drift-particle" style="left:12%; width:3px; height:3px; animation-duration:11s; animation-delay:0s; --drift-x:24px;"></div>
      <div class="drift-particle" style="left:24%; width:2px; height:2px; animation-duration:14s; animation-delay:2s; --drift-x:-18px;"></div>
      <div class="drift-particle" style="left:38%; width:4px; height:4px; animation-duration:10s; animation-delay:5s; --drift-x:30px;"></div>
      <div class="drift-particle" style="left:52%; width:2px; height:2px; animation-duration:13s; animation-delay:1s; --drift-x:-22px;"></div>
      <div class="drift-particle" style="left:66%; width:3px; height:3px; animation-duration:12s; animation-delay:4s; --drift-x:20px;"></div>
      <div class="drift-particle" style="left:78%; width:2px; height:2px; animation-duration:15s; animation-delay:3s; --drift-x:-15px;"></div>
      <div class="drift-particle" style="left:88%; width:3px; height:3px; animation-duration:11s; animation-delay:6s; --drift-x:18px;"></div>
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
    </div>

    <div class="status-badge" id="statusBadge">CONNECTING…</div>

    <div class="celebration" id="celebration"></div>

  </div>
</div>

<script>
// ===========================================================================
// LIVE CONNECTION — receives manual trigger messages from control.html
// over WebSocket. No TikTok events involved here at all.
// ===========================================================================
function connectToServer(){
  const statusBadge = document.getElementById("statusBadge");
  let ws;
  try {
    ws = new WebSocket(`ws://${location.host}`);
  } catch (e) {
    statusBadge.textContent = "CONNECTION FAILED";
    return;
  }
  ws.onopen = () => { statusBadge.textContent = "LIVE"; };
  ws.onclose = () => {
    statusBadge.textContent = "DISCONNECTED";
    setTimeout(connectToServer, 3000);
  };
  ws.onerror = () => { statusBadge.textContent = "DISCONNECTED"; };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "showMVP") showMVP(msg.name, msg.avatar);
    else if (msg.type === "showLevelUp") showLevelUp(msg.level);
  };
}
connectToServer();

function initials(name){ return (name||"?").trim().slice(0,1).toUpperCase(); }

function burstSparkles(layer, color, count){
  const start = Date.now();
  const interval = setInterval(() => {
    if (Date.now() - start > 4500) { clearInterval(interval); return; }
    const s = document.createElement("div");
    s.className = "cel-sparkle";
    s.style.background = color;
    const size = 3 + Math.random() * 4;
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.left = (38 + Math.random() * 24) + "%";
    s.style.top = (36 + Math.random() * 20) + "%";
    layer.appendChild(s);
    setTimeout(() => s.remove(), 1400);
  }, 140);
}

function showMVP(name, avatar){
  const layer = document.getElementById("celebration");
  layer.style.setProperty("--cel-color", "#FFD24C");
  layer.innerHTML = `
    <div class="cel-tint"></div>
    <div class="cel-raylayer"></div>
    <div class="cel-shockwave"></div>
    <div class="cel-shockwave ring2"></div>
    <div class="cel-shockwave ring3"></div>
    <div class="cel-stage">
      <div class="mvp-crown">👑</div>
      <div class="mvp-dp-ring">
        <div class="mvp-dp-img" style="${avatar ? `background-image:url('${avatar}')` : ''}">
          ${avatar ? '' : initials(name)}
        </div>
      </div>
      <div class="mvp-name">${(name || "MVP").toUpperCase()}</div>
      <div class="mvp-label">★ MVP OF THE MATCH ★</div>
    </div>
  `;
  burstSparkles(layer, "#FFD24C");
  layer.classList.add("show");
  setTimeout(() => {
    layer.classList.remove("show");
    setTimeout(() => { layer.innerHTML = ""; }, 400);
  }, 5500);
}

function showLevelUp(level){
  const layer = document.getElementById("celebration");
  layer.style.setProperty("--cel-color", "#5AC8FF");
  layer.innerHTML = `
    <div class="cel-tint"></div>
    <div class="cel-raylayer"></div>
    <div class="cel-shockwave"></div>
    <div class="cel-shockwave ring2"></div>
    <div class="cel-shockwave ring3"></div>
    <div class="cel-stage">
      <div class="lu-label">⚡ LEVEL UP ⚡</div>
      <div class="lu-number">${level != null ? level : "—"}</div>
    </div>
  `;
  burstSparkles(layer, "#5AC8FF");
  layer.classList.add("show");
  setTimeout(() => {
    layer.classList.remove("show");
    setTimeout(() => { layer.innerHTML = ""; }, 400);
  }, 4000);
}
</script>

</body>
</html>
