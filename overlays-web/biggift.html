<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Big Gift Overlay</title>
<link rel="stylesheet" href="shared.css" />
<style>
  html, body { background: transparent; }
  .stage { overflow: hidden; display: flex; align-items: center; justify-content: center; }

  .bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 300ms ease;
  }
  .bg-video.show { opacity: 1; }
  .bg-fade {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 55%, transparent 35%, rgba(5, 3, 1, 0.65) 100%);
  }

  .banner {
    position: relative;
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 30px 50px;
    opacity: 0;
  }
  .banner.show { animation: popIn 550ms cubic-bezier(0.2,0.9,0.25,1) forwards; }
  .banner.fadeout { animation: fadeOut 500ms ease-in forwards; }

  .avatar { width: 130px; height: 130px; flex-shrink: 0; }
  .text-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .title { font-size: 26px; letter-spacing: 4px; text-transform: uppercase; }
  .name { font-size: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 560px; }
  .detail { font-size: 24px; color: #f0ead6; }
  .diamond { color: #d4af37; }
</style>
</head>
<body>
<div class="stage">
  <video id="bgVideo" class="bg-video" src="/video/biggift_fireworks.mp4" muted playsinline></video>
  <div class="bg-fade"></div>
  <div id="banner" class="banner card">
    <img id="avatar" class="avatar" src="" />
    <div class="text-col">
      <span class="title gold-shimmer">Big Gift!</span>
      <span id="name" class="name username"></span>
      <span id="detail" class="detail"></span>
    </div>
  </div>
</div>
<script src="shared.js"></script>
<script>
  const bgVideo = document.getElementById('bgVideo');
  const banner = document.getElementById('banner');
  const avatarEl = document.getElementById('avatar');
  const nameEl = document.getElementById('name');
  const detailEl = document.getElementById('detail');

  const queue = createOverlayQueue(async (job) => {
    nameEl.textContent = job.user;
    detailEl.innerHTML = job.diamondCount
      ? `sent <strong>${job.giftName}</strong> - <span class="diamond">${job.diamondCount} ◆</span>`
      : `sent <strong>${job.giftName}</strong>`;
    avatarEl.src = job.avatarUrl || '';

    bgVideo.currentTime = 0;
    bgVideo.play().catch(() => {});
    bgVideo.classList.add('show');

    banner.classList.remove('show', 'fadeout');
    void banner.offsetWidth;
    banner.classList.add('show');

    const fadeMs = 500;
    await waitMs(Math.max(job.durationMs - fadeMs, 400));
    banner.classList.remove('show');
    banner.classList.add('fadeout');
    bgVideo.classList.remove('show');
    await waitMs(fadeMs);
    banner.classList.remove('fadeout');
    bgVideo.pause();
  });

  connectOverlayWs((msg) => {
    if (msg.type === 'biggift') {
      queue.push({
        user: msg.user || 'Someone',
        giftName: msg.giftName || 'a gift',
        diamondCount: msg.diamondCount,
        avatarUrl: msg.avatarUrl,
        durationMs: msg.durationMs || 3000,
      });
    }
  });
</script>
</body>
</html>
